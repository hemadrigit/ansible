---
- name: install nginx
  hosts: localhost
  connection: local
  vars:
     packages:
       -  { name: 'nginx' , state: 'absent' }
       -  { name: 'git'   , state: 'present' }
       -  { name: 'httpd' , state: 'absent' }

  tasks:
    - name: Install packages on target server
      ansible.builtin.package:
        name: "{{ item.name }}"
        state: "{{ item.state }}"
      loop: "{{ packages }}"
      #when: item != "nginx"